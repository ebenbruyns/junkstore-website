# Site-wide announcement banners. Edited here by hand.
#
# (This was previously generated by the companion app via
# services/bannerSync.js. That was removed, so this file is now the source of
# truth. Note the admin app still lists it as a read-only "synced" viewer in
# server/lib/data-schemas.js, which is stale.)
#
# Selection rules at build time:
# - isActive: false → never shown
# - startDate / endDate → optional date window (build time check)
# - targetPages: [] → shown on every page
# - targetPages: ["/blog/", "/about/"] → only shown on those URLs
# - When multiple banners match, the highest-priority one wins.

