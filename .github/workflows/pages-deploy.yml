name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Checks out _vendor/junk-docs, which the documentation import reads.
          # Without it that directory is empty and the /docs/ section vanishes
          # from the build.
          submodules: true

      # The submodule records a commit, not a branch, so a checkout alone pins
      # the documentation to whenever that pointer was last committed here. This
      # moves it to the tip of the branch named in .gitmodules instead, so a
      # merge into junk-docs main ships on the next deploy without anyone having
      # to remember a bump commit. The committed pointer is still the floor: if
      # this step is removed, the build falls back to it rather than breaking.
      #
      # Deliberately not scheduled. The docs change rarely, so they ride along
      # with the next site deploy rather than triggering one of their own. Use
      # the Actions tab's "Run workflow" to publish a docs-only change sooner.
      - name: Use the latest documentation
        run: git submodule update --remote --merge

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      # Generates _docs/ and assets/images/docs/ from the junk-docs submodule.
      # Both are gitignored, so without this step the /docs/ section simply does
      # not exist in the build. Must run before Jekyll.
      #
      # The import fails on a broken link between documentation pages, which
      # stops the deploy. That is deliberate: a dead link is better caught here
      # than by a reader.
      - name: Import documentation
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 scripts/import-docs.py

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # - name: Test site
      #   run: |
      #     bundle exec htmlproofer _site \
      #       \-\-disable-external \
      #       \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
