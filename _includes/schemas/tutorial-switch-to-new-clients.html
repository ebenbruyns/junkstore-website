<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HowTo",
  "name": "How to Switch to the New Clients in Junk Store Pro",
  "description": "Move an existing Junk Store Pro store from the legacy flatpak clients to our own Epic, GOG and Amazon clients. Faster refreshes and multiple accounts per store.",
  "step": [
    {
      "@type": "HowToStep",
      "name": "Turn Use Legacy Clients off",
      "text": "Open the cog on the store's tab and scroll to the bottom of Advanced. On, it looks like this. This is the one you don't want: Tap it so it reads Off:",
      "image": "https://www.junkstore.xyz/assets/images/tutorials/installer/legacy-clients-setting.webp"
    },
    {
      "@type": "HowToStep",
      "name": "Clear the store's cache",
      "text": "Open the sliders menu on that tab and choose Clear All Cache. That throws away what the store has remembered locally, including its note of whether you're signed in, so it works it out again from scratch.",
      "image": "https://www.junkstore.xyz/assets/images/tutorials/installer/store-actions.webp"
    },
    {
      "@type": "HowToStep",
      "name": "Refresh the games list",
      "text": "Open the sliders menu again and choose Refresh Games List. This takes a while on a big library, and it isn't stuck. Start it and leave it alone."
    },
    {
      "@type": "HowToStep",
      "name": "Move to another tab and back",
      "text": "That's what triggers the swap. Until you do it, the store carries on as it was."
    }
  ]
}
</script>
