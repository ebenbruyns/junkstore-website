<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HowTo",
  "name": "How to Change Game Language in Junk Store Pro",
  "description": "Change the language an Epic or GOG game runs in from Game Mode on Steam Deck. Pick a language per game in its Installation settings, no Desktop Mode needed.",
  "step": [
    {
      "@type": "HowToStep",
      "name": "The normal way: per game, in Installation settings: Open the game's Installation settings",
      "text": "On the game's page, open the cog, then choose Installation.",
      "image": "https://www.junkstore.xyz/assets/images/tutorials/change-language/game-settings-menu.webp"
    },
    {
      "@type": "HowToStep",
      "name": "The normal way: per game, in Installation settings: Open the Languages section",
      "text": "The panel is built for that game by asking the store what it offers, so you'll see only the sections that apply. Languages lists the versions available beyond what's already installed."
    },
    {
      "@type": "HowToStep",
      "name": "The normal way: per game, in Installation settings: Pick your language, then save",
      "text": "The two stores hand you a different control, so it's worth knowing which one you're looking for. GOG gives you a dropdown and you pick one language. English is the default, and the help pane on the right lists what this particular game offers. Epic gives you tickboxes, none of them ticked, and you can choose more than one. Epic calls these install tags, and on some games they cover more than language. Press X to save the config.",
      "image": "https://www.junkstore.xyz/assets/images/tutorials/change-language/install-languages-gog.webp"
    },
    {
      "@type": "HowToStep",
      "name": "The normal way: per game, in Installation settings: If the game is already installed, verify or repair it",
      "text": "The panel doesn't move any files on its own. Choosing a language records that you want it, it doesn't fetch it. Run Verify game or Repair game from the game's own menu to pull the language files down. Skip this and nothing appears to happen, which is the usual reason people report that changing a language did nothing. Expect it to take a while on a large game, since it checks what's on disk before working out what's missing. On a game you haven't installed yet there's nothing else to do, as the download picks up your choice. That's the reason to open this before installing something large. Nothing asks you about any of it by default, so you get English and every DLC you own, which can be a good deal more than you wanted. Setting it beforehand costs nothing. Setting it afterwards costs you a verify or repair."
    },
    {
      "@type": "HowToStep",
      "name": "If the game offers no language option: Open the game's configs",
      "text": "On the game's page, open the cog, then Game configs, and set the dropdown to All to reveal everything.",
      "image": "https://www.junkstore.xyz/assets/images/tutorials/change-language/GameConfi.webp"
    },
    {
      "@type": "HowToStep",
      "name": "If the game offers no language option: Set LANG under Environment",
      "text": "Open the ENVIRONMENT section, select LANG, and choose your language. HOST_LC_ALL sits just above it and does the same job more forcefully: LANG offers the game a default, HOST_LC_ALL overrides the individual locale settings outright. Try LANG first and only reach for the other one if the game ignores it.",
      "image": "https://www.junkstore.xyz/assets/images/tutorials/change-language/LangDropdown.webp"
    },
    {
      "@type": "HowToStep",
      "name": "If the game offers no language option: Save",
      "text": "Press X to save. Because you set it here rather than on the store, it affects this one game and is easy to undo."
    }
  ]
}
</script>
